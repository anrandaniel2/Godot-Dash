name: Build Web HTML5

# Builds a standalone HTML5 Web package automatically.
#
#   - Every push to main / arena branches (and manual dispatch) exports
#     the HTML5 package and uploads it as a workflow artifact.
#     Grab it from Actions run -> Artifacts -> godot-dash-web-html5.
#   - Every successful export also updates the rolling "web-html5" prerelease
#     with the newest ZIP:
#       https://github.com/anrandaniel2/Godot-Dash/releases/download/web-html5/godot-dash-web-html5.zip
#   - Multi-threading is enabled (variant/thread_support=true) with PWA
#     Cross-Origin Isolation headers for SharedArrayBuffer support.
#   - Mobile renderer is requested (renderer/rendering_method.web="mobile")
#     with automatic fallback to Compatibility (WebGL 2.0) when needed.

on:
  workflow_dispatch:
  push:
    branches: [main, master, "arena/**"]
    tags: ["release*"]

concurrency:
  group: web-html-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918
  EM_VERSION: 3.1.64
  GODOT_BIN_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_TPZ_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
  GODOT_BIN: godot-bin/Godot_v4.7.2-stable_linux.x86_64
  WEB_DIR: export/Web
  ZIP_NAME: godot-dash-web-html5.zip

jobs:
  web-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------- CORS relay Worker self-test
      # The hosted build reaches RobTop/GDHistory/song hosts through
      # tools/web_relay_worker.js; its request translation is covered here
      # because the Godot export cannot exercise it.
      - name: Check the CORS relay Worker
        run: node tools/web_relay_worker_selftest.mjs

      # ------------------------------------------------- Native GDExtension (WebAssembly)
      - name: Install scons
        run: pip3 install --break-system-packages -q scons

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}

      - name: Verify Emscripten
        run: emcc -v

      - name: Cache scons build cache
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-scons-web-${{ env.GODOT_CPP_REF }}-${{ env.EM_VERSION }}

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Build gdash_native for Web (WASM multi-threaded)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          cd native
          mkdir -p bin/web

          emit_scons_error() {
            echo "scons FAILED; tail of $1:"
            tail -n 50 "$1"
          }

          echo "Compiling template_release (threads=yes)..."
          if ! scons platform=web target=template_release arch=wasm32 threads=yes api_version=4.7 debug_symbols=no -j2 > /tmp/scons_web_release.log 2>&1; then
            emit_scons_error /tmp/scons_web_release.log
            exit 1
          fi
          tail -n 5 /tmp/scons_web_release.log

          echo "Compiling template_debug (threads=yes)..."
          if ! scons platform=web target=template_debug arch=wasm32 threads=yes api_version=4.7 debug_symbols=yes -j2 > /tmp/scons_web_debug.log 2>&1; then
            emit_scons_error /tmp/scons_web_debug.log
            exit 1
          fi
          tail -n 5 /tmp/scons_web_debug.log

          ls -lh bin/web/
          test -f bin/web/libgdash_native.web.template_release.wasm32.wasm || { echo "::error::Release wasm missing"; exit 1; }
          test -f bin/web/libgdash_native.web.template_debug.wasm32.wasm || { echo "::error::Debug wasm missing"; exit 1; }

      # ---------------------------------------------------------------- Godot
      - name: Cache Godot binary
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "$GODOT_BIN_URL" -O godot.zip
          mkdir -p godot-bin
          unzip -q -o godot.zip -d godot-bin
          rm -f godot.zip
          chmod +x "$GODOT_BIN"

      - name: Cache export templates
        uses: actions/cache@v4
        id: cache-templates
        with:
          path: godot-export-templates.tpz
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: wget -q "$GODOT_TPZ_URL" -O godot-export-templates.tpz

      - name: Install export templates
        run: |
          set -euo pipefail
          TPZ_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          mkdir -p "$TPZ_DIR"
          unzip -q -o godot-export-templates.tpz -d "$TPZ_DIR"
          if [ -d "$TPZ_DIR/templates" ]; then
            mv -f "$TPZ_DIR"/templates/* "$TPZ_DIR"/
            rmdir "$TPZ_DIR/templates"
          fi
          ls -1 "$TPZ_DIR" | head -n 20

      # -------------------------------------------------------- Project Build
      # The import pass parses every GDScript file in the project, so its log is
      # the cheapest place to fail a build whose scripts no longer compile -
      # a parse error otherwise only shows up when the exported game runs.
      - name: Import project resources
        run: |
          set -euo pipefail
          rc=0
          "$GODOT_BIN" --headless --editor --quit 2>&1 | tee /tmp/import.log || rc=$?
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/import.log; then
            # The log is thousands of lines long, so mirror the interesting
            # ones into annotations where they are easy to read.
            PATTERN='SCRIPT ERROR|Parse Error|Failed to load script|GDScript::reload|res://[^ ]*\.gd:[0-9]+'
            grep -nE "$PATTERN" /tmp/import.log | head -40 > /tmp/import_errors.txt
            while IFS= read -r line; do
              echo "::error::${line//'%'/'%25'}"
            done < /tmp/import_errors.txt
            echo "GDScript failed to parse; see the annotations above."
            exit 1
          fi
          exit "$rc"

      - name: Export Web (multi-threaded, mobile renderer if possible)
        run: |
          set -euo pipefail
          mkdir -p "$WEB_DIR"
          "$GODOT_BIN" --headless --export-release "Web" "$WEB_DIR/index.html" || \
          "$GODOT_BIN" --headless --export-debug "Web" "$WEB_DIR/index.html"
          echo "Web export folder contents:"
          ls -la "$WEB_DIR"

      - name: Verify Web Export Artifacts
        run: |
          set -euo pipefail
          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/index.js"
          test -f "$WEB_DIR/index.pck"
          test -f "$WEB_DIR/index.wasm"
          echo "Verified core Web files exist."
          if ls "$WEB_DIR"/*worker* 1> /dev/null 2>&1; then
            echo "Multi-threaded worker / service worker files:"
            ls -la "$WEB_DIR"/*worker*
          fi

      - name: Package Web HTML5 zip
        run: |
          set -euo pipefail
          cd "$WEB_DIR"
          zip -r "../../$ZIP_NAME" ./*
          cd ../..
          ls -lh "$ZIP_NAME"

      # -------------------------------------------------------------- Outputs
      - name: Upload Web HTML5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-dash-web-html5-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Attach Web zip to release (release* tags only)
        if: startsWith(github.ref, 'refs/tags/release')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      # ------------------------------------------------ Rolling debug release
      - name: Publish rolling web-html5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="web-html5"
          ARTIFACT_NAME="godot-dash-web-html5-${GITHUB_SHA::8}.zip"
          cp "$ZIP_NAME" "$ARTIFACT_NAME"
          NOTES_FILE="$(mktemp)"
          {
            echo "Automatic Web (HTML5) multi-threaded build of \`${GITHUB_SHA::8}\` on \`$GITHUB_REF_NAME\`."
            echo ""
            echo "Download and unzip to host on any web server or static hosting service."
            echo "- Multi-threading: Enabled (SharedArrayBuffer)"
            echo "- Renderer: Mobile renderer preferred, with fallback to WebGL 2.0 (Compatibility)"
            echo "- Cross-Origin Isolation: PWA service worker enabled"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          fi
          gh release create "$RELEASE_TAG" "$ZIP_NAME" "$ARTIFACT_NAME" \
            --target "$GITHUB_SHA" \
            --title "Web HTML5 build — $GITHUB_REF_NAME ${GITHUB_SHA::8}" \
            --notes-file "$NOTES_FILE" \
            --prerelease
          rm -f "$NOTES_FILE" "$ARTIFACT_NAME"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
