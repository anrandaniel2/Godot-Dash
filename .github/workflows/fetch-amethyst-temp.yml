name: Fetch Amethyst (temporary)

# One-off: copies the Amethyst download (artifact from run 38059630525,
# fetched from the maintainer's WeTransfer share) into levels/amethyst/ on
# this branch. Delete this workflow after use.
on:
  push:
    paths:
      - ".github/workflows/fetch-amethyst-temp.yml"

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download artifact from the WeTransfer fetch run
        uses: actions/download-artifact@v4
        with:
          name: amethyst-raw
          run-id: 38059630525
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/amethyst-art
      - name: Place file
        run: |
          ls -la /tmp/amethyst-art
          python3 -c "import zipfile,glob;print([zipfile.is_zipfile(p) for p in glob.glob('/tmp/amethyst-art/*')])"
          mkdir -p levels/amethyst
          cp /tmp/amethyst-art/amethyst.raw levels/amethyst/amethyst.download
          ls -la levels/amethyst
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add levels/amethyst/amethyst.download
          git commit -m "Add Amethyst level download (from WeTransfer share, temp workflow)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
