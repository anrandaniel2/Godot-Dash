name: Picking check

# Manual run. Compares the editor's decoration picking index with the physics
# overlaps on a real level (Milestone M1 of the batched-decoration plan).
# Only the verification runs here; the editor does not switch picking yet.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "WeTransfer (or direct) link to the level files"
        required: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: godot-bin/Godot_v4.7.2-stable_linux.x86_64
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918

jobs:
  picking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "$GODOT_BIN_URL" -O godot.zip
          mkdir -p godot-bin
          unzip -q -o godot.zip -d godot-bin

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Cache scons build cache
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-scons-profile-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/src/**') }}
          restore-keys: native-scons-profile-${{ env.GODOT_CPP_REF }}-

      - name: Build gdash_native (Linux, release-like)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages -q scons
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          cd native
          scons platform=linux target=template_debug arch=x86_64 api_version=4.7 lto=none -j4 > /tmp/scons.log 2>&1 || { tail -n 60 /tmp/scons.log; exit 1; }
          ls -lh bin/linux/

      - name: Download the shared levels
        env:
          LEVEL_URL: ${{ inputs.url || 'https://we.tl/t-6m0QzdqbUvQ8sm3a' }}
        run: |
          set -euo pipefail
          python3 tools/fetch_transfer_levels.py "$LEVEL_URL" /tmp/bli

      - name: Compare picking index with physics
        run: |
          set -uo pipefail
          GDASH_MEM_LEVEL=/tmp/bli/90475473.gmd timeout 900s "$GODOT_BIN" --headless --path . --audio-driver Dummy res://tools/picking_check.tscn > /tmp/pick.log 2>&1
          rc=$?
          grep -E "PICK_CHECK|SCRIPT ERROR|Parse Error" /tmp/pick.log | head -60 | cut -c1-300
          echo "exit rc=$rc"
          grep -q "PICK_CHECK result=PASS" /tmp/pick.log
