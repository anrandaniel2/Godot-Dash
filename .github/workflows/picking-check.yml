name: Picking check

# Manual or path-triggered run. Compares the decoration picking index with physics
# overlaps on a real level (Milestone M1 of the batched-decoration plan).
# Only the verification runs here; the editor does not switch picking yet.

on:
  push:
    paths:
      - "src/editor/DecorationPicker.gd"
      - "tools/picking_check.gd"
      - "tools/picking_check.tscn"
      - ".github/workflows/picking-check.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "WeTransfer (or direct) link to the level files"
        required: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: godot-bin/Godot_v4.7.2-stable_linux.x86_64
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918

jobs:
  picking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "$GODOT_BIN_URL" -O godot.zip
          mkdir -p godot-bin
          unzip -q -o godot.zip -d godot-bin

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Cache scons build cache
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-scons-profile-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/src/**') }}
          restore-keys: native-scons-profile-${{ env.GODOT_CPP_REF }}-

      - name: Build gdash_native (Linux, release-like)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages -q scons
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          cd native
          scons platform=linux target=template_debug arch=x86_64 api_version=4.7 lto=none -j4 > /tmp/scons.log 2>&1 || { tail -n 60 /tmp/scons.log; exit 1; }
          ls -lh bin/linux/

      - name: Download the shared levels
        env:
          LEVEL_URL: ${{ inputs.url || 'https://we.tl/t-6m0QzdqbUvQ8sm3a' }}
        run: |
          set -euo pipefail
          python3 tools/fetch_transfer_levels.py "$LEVEL_URL" /tmp/bli

      # A fresh checkout has no imported resources or global script class cache.
      # Warm and check it before the scene probe, as the web workflow does.
      - name: Import project resources
        run: |
          set -euo pipefail
          timeout 300s "$GODOT_BIN" --headless --path . --editor --import > /tmp/pick_import_first.log 2>&1 || true
          timeout 300s "$GODOT_BIN" --headless --path . --editor --import > /tmp/pick_import.log 2>&1
          if grep -qE "Parse Error|Failed to load script" /tmp/pick_import.log; then
            tail -n 100 /tmp/pick_import.log
            exit 1
          fi

      - name: Compare picking index with physics
        run: |
          set -uo pipefail
          # Explicitly capture the exit code so failures/timeouts still produce
          # diagnostics, regardless of the runner shell's errexit setting.
          rc=0
          GDASH_MEM_LEVEL=/tmp/bli/90475473.gmd timeout 1500s "$GODOT_BIN" --headless --path . --audio-driver Dummy res://tools/picking_check.tscn > /tmp/pick.log 2>&1 || rc=$?
          { grep -E "PICK_CHECK|SCRIPT ERROR|Parse Error" /tmp/pick.log | head -60 | cut -c1-300; echo "exit rc=$rc"; } > /tmp/pick_summary.txt
          while IFS= read -r line; do echo "::notice title=picking::${line//%/%25}"; done < /tmp/pick_summary.txt
          test "$rc" -eq 0 || exit 1
          if grep -qE 'SCRIPT ERROR|Parse Error|Failed to load script|PICK_CHECK.*(error:|result=FAIL)' /tmp/pick.log; then
            exit 1
          fi
          grep -q "PICK_CHECK.*saturated_queries=0 result=PASS" /tmp/pick.log

      - name: Upload picking diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picking-diagnostics-${{ github.sha }}
          path: /tmp/pick*.log
          if-no-files-found: warn
