name: Fetch transfer

# Downloads a maintainer-shared WeTransfer bundle on the runner (the sandbox
# cannot reach it) and commits downscaled frames for review. Temporary.
on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/fetch-transfer.yml"

permissions:
  contents: write

env:
  TRANSFER_ID: "2651accf8ef6c1e3a2def9cf240fdf1020261008221624"
  SECURITY_HASH: "4011db"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          resp=$(curl -s -m 60 -X POST -H "Content-Type: application/json" \
            -d "{\"security_hash\":\"$SECURITY_HASH\",\"intent\":\"entire_transfer\"}" \
            "https://wetransfer.com/api/v4/transfers/$TRANSFER_ID/download")
          echo "::notice title=api::$(echo "$resp" | head -c 300)"
          url=$(echo "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('direct_link',''))")
          mkdir -p dl && curl -sL -m 900 "$url" -o dl/transfer.bin
          cd dl && file transfer.bin
          if file transfer.bin | grep -q Zip; then unzip -q transfer.bin && rm transfer.bin; fi
          ls -laR . | head -50
          echo "::notice title=files::$(find . -type f -printf '%s %p; ' | head -c 3000)"
      - name: Frames
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p scratch/transfer
          i=0
          find dl -type f | while read -r f; do
            i=$((i+1))
            info=$(ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of compact "$f" | tr '\n' ' ')
            echo "::notice title=probe $i::$f $info"
            case "$f" in
              *.png|*.jpg|*.jpeg|*.webp) ffmpeg -v error -i "$f" -vf "scale=960:-2" "scratch/transfer/v${i}_img.jpg" ;;
              *) ffmpeg -v error -i "$f" -vf "fps=1/2,scale=640:-2" -q:v 6 "scratch/transfer/v${i}_%04d.jpg" ;;
            esac
          done
          ls scratch/transfer | wc -l
          du -sh scratch/transfer
      - name: Commit frames
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add scratch/transfer
          git commit -qm "scratch: transfer frames [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
