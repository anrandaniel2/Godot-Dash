name: Level probe

# Plays a downloaded level in the real GameScene (tools/level_probe.gd) and
# surfaces the PROBE log as annotations. The level is never committed.
on:
  push:
    branches: ["arena/**"]
    paths:
      - "native/src/**"
      - "tools/level_probe.gd"
      - "tools/level_probe.tscn"
      - ".github/workflows/level-probe.yml"

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: godot-bin/Godot_v4.7.2-stable_linux.x86_64
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918
  # Amethyst (119550490), exported by the maintainer as .gmd2.
  LEVEL_URL: "https://www.dropbox.com/scl/fi/3s9q0aalv0gluzswgubah/Amethyst.gmd2?rlkey=j8qi88gc0futnycz80j1fa8cb&dl=1"
  PROBE_GROUPS: "948,949,950,951,940,960,981,987"
  PROBE_DENSE_FROM: "31300"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "$GODOT_BIN_URL" -O godot.zip
          mkdir -p godot-bin
          unzip -q -o godot.zip -d godot-bin

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Cache scons build cache
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-scons-probe-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/src/**') }}
          restore-keys: native-scons-probe-${{ env.GODOT_CPP_REF }}-

      - name: Build gdash_native (Linux, release-like)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages -q scons
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          cd native
          scons platform=linux target=template_debug arch=x86_64 api_version=4.7 lto=none -j4 > /tmp/scons.log 2>&1 || { tail -n 60 /tmp/scons.log; exit 1; }
          ls -lh bin/linux/

      - name: Download level
        run: curl -sL -m 120 "$LEVEL_URL" -o /tmp/level.gmd2 && ls -la /tmp/level.gmd2

      - name: Import project resources
        run: |
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import > import.log 2>&1 || true
          grep -n "SCRIPT ERROR\|Parse Error" import.log | head -20 || true

      - name: Probe
        run: |
          set +e
          env GDASH_PROBE_LEVEL=/tmp/level.gmd2 GDASH_PROBE_GROUPS="$PROBE_GROUPS" GDASH_PROBE_DENSE_FROM="$PROBE_DENSE_FROM" \
            timeout 1800s "$GODOT_BIN" --headless --path . --audio-driver Dummy res://tools/level_probe.tscn > probe.log 2>&1
          echo "exit $?" > probe.txt
          grep -E "PROBE|SCRIPT ERROR|ERROR:|FADIAG|at: " probe.log | cut -c1-3000 >> probe.txt
          tail -c 3000 probe.log >> probe.txt
          wc -c probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: probe.txt
          retention-days: 1

  report:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: probe-log
      - name: Slices 0
        run: python3 -c "t=open('probe.txt').read();base=(${{ matrix.part }}*50+0);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 1
        run: python3 -c "t=open('probe.txt').read();base=(${{ matrix.part }}*50+10);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 2
        run: python3 -c "t=open('probe.txt').read();base=(${{ matrix.part }}*50+20);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 3
        run: python3 -c "t=open('probe.txt').read();base=(${{ matrix.part }}*50+30);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 4
        run: python3 -c "t=open('probe.txt').read();base=(${{ matrix.part }}*50+40);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
