name: Level scan

# Downloads a Geometry Dash level on the runner, scans it with
# tools/gd_level_scan.py and surfaces the report as annotations. The level
# string is never committed or uploaded.
on:
  push:
    paths:
      - "tools/gd_level_scan.py"
      - ".github/workflows/level-scan.yml"

env:
  # Amethyst (119550490), exported by the maintainer as .gmd2.
  LEVEL_URL: "https://www.dropbox.com/scl/fi/3s9q0aalv0gluzswgubah/Amethyst.gmd2?rlkey=j8qi88gc0futnycz80j1fa8cb&dl=1"
  FOCUS_FROM: "0.9"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download level
        run: |
          curl -sL -m 120 "$LEVEL_URL" -o level.txt
          echo "::notice title=download::size=$(stat -c %s level.txt) type=$(file -b level.txt | cut -c1-60)"
      - name: Scan
        run: |
          if ! python3 tools/gd_level_scan.py level.txt --focus-from "$FOCUS_FROM" --channels "3,25,111,235,239,243,257,258,267,268,272,274,276,277,278,294,295,354,502,504,775,776,826,962,977,1002,1011,1012" > report.txt 2> err.txt; then
            echo "::warning title=scan failed::size=$(stat -c %s level.txt) head=$(head -c 300 level.txt | tr -d '\n\r%') err=$(tail -c 800 err.txt | tr '\n' ' ')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: report.txt
          retention-days: 1

  # Annotations are cut at ~4 KB and capped at 10 per type per step, so each
  # matrix job surfaces 50 slices of 3900 characters.
  report:
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scan-report
      - name: Slices 0
        run: python3 -c "t=open('report.txt').read();base=(${{ matrix.part }}*50+0);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 1
        run: python3 -c "t=open('report.txt').read();base=(${{ matrix.part }}*50+10);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 2
        run: python3 -c "t=open('report.txt').read();base=(${{ matrix.part }}*50+20);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 3
        run: python3 -c "t=open('report.txt').read();base=(${{ matrix.part }}*50+30);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
      - name: Slices 4
        run: python3 -c "t=open('report.txt').read();base=(${{ matrix.part }}*50+40);[print('::notice title=s%04d::'%k+t[k*3900:(k+1)*3900].replace('%','%25').replace('\r','').replace('\n','%0A')) for k in range(base,base+10) if t[k*3900:(k+1)*3900]]"
