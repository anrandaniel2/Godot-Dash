name: Level scan

# Downloads a Geometry Dash level on the runner, scans it with
# tools/gd_level_scan.py and surfaces the report as annotations. The level
# string is never committed or uploaded.
on:
  push:
    paths:
      - "tools/gd_level_scan.py"
      - ".github/workflows/level-scan.yml"

env:
  LEVEL_ID: "119550490"
  FOCUS_FROM: "0.9"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download level
        run: |
          set -u
          ok() { [ -s level.txt ] && grep -q -E '^1:|<k>k4</k>|^H4sI' <(head -c 2000 level.txt); }
          report() { echo "::warning title=$1::code=$2 size=$(stat -c %s level.txt 2>/dev/null) head=$(head -c 160 level.txt 2>/dev/null | tr -d '\n\r%')"; }
          for url in https://www.boomlings.com/database/downloadGJLevel22.php http://www.boomlings.com/database/downloadGJLevel22.php https://boomlings.com/database/downloadGJLevel22.php; do
            code=$(curl -s -m 60 -A "" -H "Content-Type: application/x-www-form-urlencoded" -X POST "$url" \
              -d "gameVersion=22&binaryVersion=42&levelID=${LEVEL_ID}&secret=Wmfd2893gb7" -o level.txt -w "%{http_code}" || true)
            report "$url" "$code"; ok && exit 0
          done
          for url in "https://gdbrowser.com/api/level/${LEVEL_ID}?download" \
                     "https://history.geometrydash.eu/level/${LEVEL_ID}/126902325/download/"; do
            code=$(curl -s -L -m 120 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" "$url" -o level.txt -w "%{http_code}" || true)
            report "$url" "$code"; ok && exit 0
          done
          exit 1
      - name: Scan
        run: |
          if ! python3 tools/gd_level_scan.py level.txt --focus-from "$FOCUS_FROM" > report.txt 2> err.txt; then
            echo "::warning title=scan failed::size=$(stat -c %s level.txt) head=$(head -c 300 level.txt | tr -d '\n\r%') err=$(tail -c 800 err.txt | tr '\n' ' ')"
            exit 1
          fi
      - name: Report part 1
        run: python3 -c "import sys;t=open('report.txt').read();[print('::notice title=scan %d::'%i+t[i*60000:(i+1)*60000].replace('%','%25').replace('\r','').replace('\n','%0A')) for i in range(0,10) if t[i*60000:(i+1)*60000]]"
      - name: Report part 2
        run: python3 -c "import sys;t=open('report.txt').read();[print('::notice title=scan %d::'%i+t[i*60000:(i+1)*60000].replace('%','%25').replace('\r','').replace('\n','%0A')) for i in range(10,20) if t[i*60000:(i+1)*60000]]"
