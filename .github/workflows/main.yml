name: Build Android APK

# Builds an installable debug .apk automatically so device testing is a
# download-and-install instead of opening the project on a device (~20 min).
#
#   - Every push to main / arena branches (and every manual dispatch) exports
#     an APK and uploads it as a workflow artifact. Grab it from the Actions
#     run page -> Artifacts -> godot-dash-android-debug.
#   - Every successful export also refreshes the rolling "android-debug"
#     prerelease with the newest APK, so the latest build is always one
#     download away (constant URL, no Actions login needed):
#       https://github.com/anrandaniel2/Godot-Dash/releases/download/android-debug/godot-dash-android-debug.apk
#   - A push of a `release*` tag additionally creates the stable release for
#     that tag, as before.
#
# The export uses the Godot 4.x Android Gradle build (export preset "Android"
# has gradle_build/use_gradle_build=true), which lets the manifest be edited:
# the workflow installs the stock Android build template from the export
# templates and adds android:largeHeap="true" to its AndroidManifest.xml, so
# the app asks Android for the large heap on devices that allow it (the heap
# itself is still bounded by the device).
#
# Before exporting, the native GDExtension (native/) is compiled with the
# Android NDK against a pinned godot-cpp master commit (the Godot 4.7 API;
# no godot-cpp 4.6/4.7 tag exists). The resulting .so is bundled into the APK
# two ways: Godot's exporter normally copies it into the gradle project via
# native/bin/gdash_native.gdextension (checkpointed below), and independently the
# .so is dropped straight into the gradle debug jniLibs so the APK contains it
# even if the exporter path fails.

on:
  workflow_dispatch:
  push:
    branches: [main, master, "arena/**"]
    tags: ["release*"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  # Godot standard (non-.NET) build & export templates for the version above.
  # Must match project.godot's config/features ("4.7") minor line exactly.
  GODOT_BIN_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_TPZ_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
  GODOT_BIN: godot-bin/Godot_v4.7.2-stable_linux.x86_64
  APK_PATH: export/Android/godot-dash.apk
  # Native extension: godot-cpp master (v10) pinned to a commit, building the
  # Godot 4.7 API (no godot-cpp 4.6/4.7 tag exists yet - master is the
  # maintained path per godot-cpp's README). NDK version must match the folder
  # name sdkmanager installs under $ANDROID_HOME/ndk/.
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918
  NDK_VERSION: 28.1.13356709

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle build requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------- Godot
      - name: Cache Godot binary
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "$GODOT_BIN_URL" -O godot.zip
          mkdir -p godot-bin
          unzip -q -o godot.zip -d godot-bin
          rm -f godot.zip
          chmod +x "$GODOT_BIN"

      - name: Cache export templates
        uses: actions/cache@v4
        id: cache-templates
        with:
          path: godot-export-templates.tpz
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: wget -q "$GODOT_TPZ_URL" -O godot-export-templates.tpz

      - name: Install export templates
        run: |
          TPZ_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          mkdir -p "$TPZ_DIR"
          unzip -q -o godot-export-templates.tpz -d "$TPZ_DIR"
          # The archive nests everything under templates/; Godot wants the
          # files directly in the version folder.
          if [ -d "$TPZ_DIR/templates" ]; then
            mv -f "$TPZ_DIR"/templates/* "$TPZ_DIR"/
            rmdir "$TPZ_DIR/templates"
          fi
          ls -1 "$TPZ_DIR" | head

      # ------------------------------------------------------- Android tooling
      - name: Verify Android SDK components
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME not set on this runner}"
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platform-tools" "build-tools;35.0.1" "platforms;android-35" >/dev/null || true
          else
            echo "sdkmanager not found at $SDKMANAGER; relying on preinstalled SDK."
          fi
          "$ANDROID_HOME/build-tools"/*/apksigner --version | head -1 || true

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ------------------------------------------------- Native GDExtension
      # Builds native/src/gdash_native.cpp into the .so bundled into the APK by
      # native/bin/gdash_native.gdextension. The extension only registers a boot
      # probe class today (Config.use_native_core); game systems port to C++
      # behind that flag incrementally.
      - name: Install scons
        run: pip3 install --break-system-packages -q scons

      - name: Cache scons build cache
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-scons-${{ env.GODOT_CPP_REF }}-api47-profile-v1-lto

      # godot-cpp is cloned fresh each run (small, shallow) rather than cached:
      # caching it alongside the multi-GB NDK made cache restore unreliable.
      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Build gdash_native (Linux x86_64 test host, Godot 4.7 API)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          cd native
          scons platform=linux target=template_debug arch=x86_64 api_version=4.7 -j2
          test -f bin/linux/libgdash_native.linux.template_debug.x86_64.so
          ls -lh bin/linux/libgdash_native.linux.template_debug.x86_64.so
          # Catch accidental return to the all-classes godot-cpp build.
          test "$(stat -c%s bin/linux/libgdash_native.linux.template_debug.x86_64.so)" -lt 2000000
          # Preserve the host library while cleaning shared intermediates before
          # the ARM build. Restore it for the visual smoke test afterward.
          cp bin/linux/libgdash_native.linux.template_debug.x86_64.so /tmp/libgdash_native.linux.so
          scons -c platform=linux target=template_debug arch=x86_64 api_version=4.7
          mkdir -p bin/linux
          cp /tmp/libgdash_native.linux.so bin/linux/libgdash_native.linux.template_debug.x86_64.so
          ls -lh bin/linux/

      - name: Locate or install Android NDK
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME not set on this runner}"
          # Use an already-installed NDK if present (runners ship one), else
          # install the pinned version. Any modern NDK compiles godot-cpp.
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1 || true)
          if [ -z "$NDK_DIR" ]; then
            SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
            if [ ! -x "$SDKMANAGER" ]; then
              echo "no NDK installed and sdkmanager not found at $SDKMANAGER"; exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;${{ env.NDK_VERSION }}" >/dev/null
            NDK_DIR="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          fi
          [ -d "$NDK_DIR" ] || { echo "NDK still missing at $NDK_DIR"; ls "$ANDROID_HOME/ndk"; exit 1; }
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Build gdash_native (Android arm64, Godot 4.7 API)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          NDK_VERSION="$(basename "$NDK_DIR")"
          cd native
          scons platform=android target=template_debug arch=arm64 \
            api_version=4.7 ndk_version="$NDK_VERSION" -j2
          test -f bin/android/libgdash_native.android.template_debug.arm64.so
          test "$(stat -c%s bin/android/libgdash_native.android.template_debug.arm64.so)" -lt 2500000
          ls -lh bin/android/

      # ------------------------------------------------- Android build template
      - name: Install Android build template (res://android/build)
        run: |
          TPZ_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          if [ ! -f "$TPZ_DIR/android_source.zip" ]; then
            echo "android_source.zip missing from export templates:"; ls -1 "$TPZ_DIR"; exit 1
          fi
          rm -rf android android_tmp
          mkdir -p android_tmp
          unzip -q -o "$TPZ_DIR/android_source.zip" -d android_tmp
          # Zip layout varies (files at root vs under a build/ folder); find the
          # Gradle project root either way.
          if [ -f android_tmp/build.gradle ] || [ -d android_tmp/app ]; then
            SRC=android_tmp
          elif [ -d android_tmp/build ]; then
            SRC=android_tmp/build
          elif [ -d android_tmp/android/build ]; then
            SRC=android_tmp/android/build
          else
            echo "Unexpected android_source.zip layout:"; find android_tmp -maxdepth 3 | head -20; exit 1
          fi
          mkdir -p android/build android/plugins
          cp -a "$SRC"/. android/build/
          # Markers Godot uses to recognise the installed template.
          echo "${{ env.GODOT_VERSION }}.stable" > android/.build_version
          echo "${{ env.GODOT_VERSION }}.stable" > android/build/.build_version
          touch android/build/.gdignore android/plugins/.gdignore
          chmod +x android/build/gradlew
          test -f android/build/build.gradle && echo "template installed: $(ls android/build | head -5)"

      - name: Enable android:largeHeap in the app manifest
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, sys
          manifests = sorted(glob.glob("android/build/**/AndroidManifest.xml", recursive=True))
          if not manifests:
              sys.exit("no AndroidManifest.xml found under android/build")
          for path in manifests:
              text = open(path, encoding="utf-8").read()
              if "android:largeHeap" in text:
                  print("already set:", path)
                  continue
              new = re.sub(
                  r"(<application\b[^>]*?)(/?>)",
                  lambda m: m.group(1) + ' android:largeHeap="true"' + m.group(2),
                  text, count=1, flags=re.S,
              )
              if new == text:
                  sys.exit("found no <application> tag to patch in %s" % path)
              open(path, "w", encoding="utf-8").write(new)
              print("android:largeHeap=\"true\" added to", path)
          PYEOF

      # The gradle template declares debug.jniLibs.srcDirs = ['libs/debug', ...]
      # (sourceSets in the app module's build.gradle). The template is a
      # single-module project whose build.gradle sits at android/build/ (flat)
      # or at android/build/app/ (nested); a .so placed at libs/debug/arm64-v8a/
      # under that module is packaged by gradle as lib/arm64-v8a/ in the APK -
      # no Godot exporter cooperation needed. This fallback bundling path is
      # redundant with the exporter's own copy (checkpointed after export).
      - name: Drop libgdash_native.android.template_debug.arm64.so into gradle debug jniLibs
        run: |
          set -euo pipefail
          SO="$PWD/native/bin/android/libgdash_native.android.template_debug.arm64.so"
          test -f "$SO" || { echo "built .so missing at $SO"; exit 1; }
          if [ -f android/build/app/build.gradle ]; then
            MODULE="android/build/app"
          elif [ -f android/build/build.gradle ]; then
            MODULE="android/build"
          else
            echo "cannot locate gradle module build.gradle under android/build:"
            find android/build -maxdepth 3 -name "build.gradle" | head
            exit 1
          fi
          TARGET="$MODULE/libs/debug/arm64-v8a"
          mkdir -p "$TARGET"
          cp "$SO" "$TARGET/$(basename "$SO")"
          echo "dropped $(basename "$SO") into $TARGET"
          ls -R "$MODULE/libs" | head -20

      # ------------------------------------------------------- Godot project
      - name: Import project resources
        run: |
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import > godot_import.log 2>&1
          status=$?
          tail -n 30 godot_import.log
          exit $status

      # A successful import only proves scripts parse. Exercise both GD artwork
      # render paths and inspect real viewport pixels so an optimization cannot
      # ship an APK in which levels load but every object is invisible.
      - name: Render generated and batched GD artwork smoke test
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          }
          set +e
          GDASH_REQUIRE_NATIVE=1 xvfb-run -a "$GODOT_BIN" --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            res://tools/runtime_visual_smoke_test.tscn \
            > visual_smoke.log 2>&1
          status=$?
          set -e
          cat visual_smoke.log
          if [ $status -ne 0 ] || ! grep -q "VISUAL_SMOKE" visual_smoke.log; then
            echo "### Visual smoke failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 visual_smoke.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Surface the complete tail in one check annotation as well;
            # Actions retains only the first ten annotations from a step and
            # its raw log blobs are not always retrievable from the sandbox.
            details=$(tail -n 80 visual_smoke.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Visual smoke::${details}"
            exit 1
          fi

      # If the import-time scan never registered native/bin/gdash_native.gdextension,
      # the exporter has nothing to attach the .so to (and the exported app's
      # runtime loader would not know the extension either). This check turns
      # that into an explicit pass/fail instead of a silent omission.
      - name: "Check extension_list.cfg lists gdash_native"
        run: |
          echo "--- .godot/extension_list.cfg ---"
          cat .godot/extension_list.cfg 2>/dev/null || echo "(no extension_list.cfg)"
          echo "--- import log GDExtension/gdash lines ---"
          grep -in "gdextension\|gdash" godot_import.log || echo "(no matches)"
          if grep -q "gdash_native" .godot/extension_list.cfg 2>/dev/null; then
            echo "REGISTERED: gdash_native is in extension_list.cfg"
          else
            echo "NOT REGISTERED: gdash_native missing from extension_list.cfg"
            exit 1
          fi

      - name: Point Godot at the Android SDK/JDK
        run: |
          SET=$(ls "$HOME/.config/godot"/editor_settings-*.tres 2>/dev/null | head -1)
          if [ -z "$SET" ]; then
            # Bootstrap once so Godot writes its editor settings file, then find it.
            "$GODOT_BIN" --headless --editor --quit --path . >/dev/null 2>&1 || true
            SET=$(ls "$HOME/.config/godot"/editor_settings-*.tres 2>/dev/null | head -1)
          fi
          if [ -z "$SET" ]; then
            mkdir -p "$HOME/.config/godot"
            SET="$HOME/.config/godot/editor_settings-4.tres"
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SET"
          fi
          JAVA_HOME_DETECTED="${JAVA_HOME:-$(dirname "$(dirname "$(command -v java)")")}"
          echo "editor settings: $SET"
          python3 - "$SET" "$ANDROID_HOME" "$JAVA_HOME_DETECTED" "$HOME/.android/debug.keystore" <<'PYEOF'
          import sys
          path, sdk, jdk, keystore = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          values = {
              "export/android/android_sdk_path": sdk,
              "export/android/java_sdk_path": jdk,
              "export/android/debug_keystore": keystore,
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          lines = open(path, encoding="utf-8").read().splitlines()
          seen = {ln.split("=", 1)[0].strip() for ln in lines if "=" in ln}
          with open(path, "w", encoding="utf-8") as fh:
              for key, val in values.items():
                  if key in seen:
                      continue
                  lines.insert(len(lines), '%s = "%s"' % (key, val))
              fh.write("\n".join(lines) + "\n")
          print("configured Android SDK/JDK/keystore in", path)
          PYEOF
          cat "$SET"

      - name: Export Android debug APK (Gradle build)
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p "$(dirname "$APK_PATH")"
          "$GODOT_BIN" --headless --path . --export-debug "Android" "$APK_PATH" > godot_export.log 2>&1
          status=$?
          tail -n 80 godot_export.log
          if [ $status -ne 0 ]; then
            exit $status
          fi
          grep -Fq 'android.arm64.single.debug = "./android/libgdash_native.android.template_debug.arm64.so"' \
            native/bin/gdash_native.gdextension || {
            echo "ERROR: native descriptor no longer matches the official godot-cpp Android layout"
            exit 1
          }
          ls -lh "$APK_PATH"

      # Godot's own bundling path: copy_gradle_so writes the extension library
      # to <gradle_build>/libs/<debug|release>/<abi>/. If this file is missing,
      # the exporter skipped the GDExtension (file not exported/typed/loaded),
      # independently of the jniLibs fallback above.
      - name: "Check exporter copied libgdash_native.android.template_debug.arm64.so into gradle libs"
        run: |
          echo "--- libgdash_native.android.template_debug.arm64.so under android/build (exporter target) ---"
          find android/build -name "libgdash_native.android.template_debug.arm64.so" 2>/dev/null || true
          if [ -f android/build/libs/debug/arm64-v8a/libgdash_native.android.template_debug.arm64.so ]; then
            echo "EXPORTED: exporter copy present at android/build/libs/debug/arm64-v8a/"
          else
            echo "ERROR: no .so at android/build/libs/debug/arm64-v8a/; the manual jniLibs copy can put bytes in the APK but cannot create Godot's runtime GDExtension resource mapping"
            exit 1
          fi
          echo "--- export log GDExtension/gdash lines ---"
          grep -in "gdextension\|gdash\|no .* library\|Copying .so" godot_export.log || echo "(no matches)"

      - name: Verify APK is arm64-v8a only and contains gdash_native
        run: |
          set -euo pipefail
          echo "native libs inside APK:"
          unzip -l "$APK_PATH" | grep -E "lib/" || true

          # Keep the APK single-ABI. export_presets.cfg enables only
          # architectures/arm64-v8a, but assert the final archive as well so a
          # future Godot/Gradle template cannot silently add 32-bit or x86
          # engine libraries and inflate the download.
          mapfile -t ABIS < <(
            unzip -Z1 "$APK_PATH" \
              | sed -n 's#^lib/\([^/]*\)/.*#\1#p' \
              | sort -u
          )
          printf 'packaged ABI: %s\n' "${ABIS[@]:-(none)}"
          if [ "${#ABIS[@]}" -ne 1 ] || [ "${ABIS[0]}" != "arm64-v8a" ]; then
            echo "ERROR: APK must contain exactly one ABI: arm64-v8a"
            exit 1
          fi

          unzip -t "$APK_PATH" "lib/arm64-v8a/libgdash_native.android.template_debug.arm64.so" >/dev/null || {
            echo "ERROR: libgdash_native.android.template_debug.arm64.so is not inside the arm64-v8a APK"
            exit 1
          }
          echo "verified: arm64-v8a only, libgdash_native.android.template_debug.arm64.so present"

      # -------------------------------------------------------------- Outputs
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-dash-android-debug-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Attach APK to release (release* tags only)
        if: startsWith(github.ref, 'refs/tags/release')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true

      # ------------------------------------------------ Rolling debug release
      - name: Publish rolling android-debug release
        # Every successful export refreshes the same prerelease (tag + release
        # are recreated so the tag always points at this build and the
        # download URL stays constant). The release* tag path above is a
        # separate, stable release and is untouched.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="android-debug"
          # A unique asset name prevents browsers/CDNs from serving an older
          # rolling APK after the release tag is recreated.
          APK_NAME="godot-dash-android-debug-${GITHUB_SHA::8}.apk"
          cp "$APK_PATH" "$APK_NAME"
          NOTES_FILE="$(mktemp)"
          {
            echo "Automatic debug build of \`${GITHUB_SHA::8}\` on \`$GITHUB_REF_NAME\`."
            echo ""
            echo "Sideload this APK for device testing (debug-signed, largeHeap enabled)."
            echo ""
            echo "Commit-specific download URL (avoids stale APK caches):"
            echo "\`https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}\`"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          fi
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "Android debug APK — $GITHUB_REF_NAME ${GITHUB_SHA::8}" \
            --notes-file "$NOTES_FILE" \
            --prerelease
          rm -f "$NOTES_FILE" "$APK_NAME"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
