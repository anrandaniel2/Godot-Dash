name: bli levels check

# Manual run: downloads the shared WeTransfer levels on the runner, scans them,
# and opens each one in a real Godot build of the game. Levels are never
# committed; results come back as check-run annotations.
on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/bli-levels.yml"
      - "tools/fetch_transfer_levels.py"
      - "tools/gd_level_scan.py"
      - "tools/level_memory_profile.gd"
      - "src/static/GMDObjects.gd"
      - "src/static/GMDConverter.gd"
  workflow_dispatch:
    inputs:
      url:
        description: "WeTransfer (or direct) link to the level files"
        required: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: godot-bin/Godot_v4.7.2-stable_linux.x86_64
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "$GODOT_BIN_URL" -O godot.zip
          mkdir -p godot-bin
          unzip -q -o godot.zip -d godot-bin

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Cache scons build cache
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-scons-profile-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/src/**') }}
          restore-keys: native-scons-profile-${{ env.GODOT_CPP_REF }}-

      - name: Build gdash_native (Linux, release-like)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages -q scons
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          cd native
          scons platform=linux target=template_debug arch=x86_64 api_version=4.7 lto=none -j4 > /tmp/scons.log 2>&1 || { tail -n 60 /tmp/scons.log; exit 1; }
          ls -lh bin/linux/

      - name: Download the shared levels
        env:
          LEVEL_URL: ${{ inputs.url || 'https://we.tl/t-x5aZPEvs5KA6m201' }}
        run: |
          set -euo pipefail
          python3 tools/fetch_transfer_levels.py "$LEVEL_URL" /tmp/bli

      - name: Scan each level (gd_level_scan)
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          # Few annotations per step: GitHub drops the rest. One start report per
          # level (name, start position, objects around it), two parts at most.
          for f in sorted(glob.glob('/tmp/bli/*')):
              if os.path.isdir(f) or f.endswith('transfer.bin'):
                  continue
              name = os.path.basename(f)
              start = subprocess.run(['python3', 'tools/gd_level_scan.py', f, '--start'], capture_output=True, text=True)
              part = start.stdout[start.stdout.find('=====START====='):]
              part = part[:part.find('objects=') if part.find('objects=') > 0 else len(part)]
              part = part.replace('=====START=====\n', '')
              for n in range(0, min(len(part), 3800 * 2), 3800):
                  print(f"::notice title=start {name} part {n // 3800}::" + esc(part[n:n + 3800]))
              if start.returncode != 0 or start.stderr.strip():
                  print(f"::warning title=scan stderr {name}::" + esc(start.stderr[-800:]))
          PY

      - name: Import project resources
        run: |
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import > import.log 2>&1 || true
          grep -n "SCRIPT ERROR\|Parse Error" import.log | head -20 || true

      - name: Open each level in the game
        env:
          GODOT_BIN: ${{ env.GODOT_BIN }}
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          godot = os.environ['GODOT_BIN']
          for f in sorted(glob.glob('/tmp/bli/*')):
              if os.path.isdir(f) or f.endswith('transfer.bin'):
                  continue
              name = os.path.basename(f)
              env = dict(os.environ, GDASH_PROFILE_LEVEL=f, GDASH_PROFILE_ALLOW_MISMATCH='1')
              try:
                  p = subprocess.run(
                      [godot, '--headless', '--path', '.', '--audio-driver', 'Dummy',
                       'res://tools/level_memory_profile.tscn'],
                      capture_output=True, text=True, timeout=400, env=env)
                  log, status = p.stdout + p.stderr, p.returncode
              except subprocess.TimeoutExpired as e:
                  log, status = (e.stdout or b'').decode(errors='replace') + (e.stderr or b'').decode(errors='replace'), 'timeout'
              open(f'/tmp/bli/{name}.log', 'w').write(log)
              print(f"##### {name} exit={status}")
              lines = log.splitlines()
              blocks, seen = [], set()
              for k, l in enumerate(lines):
                  if re.search(r'SCRIPT ERROR|ERROR|Parse Error', l):
                      block = '\n'.join(lines[k:k + 3])
                      if block not in seen:
                          seen.add(block)
                          blocks.append(block)
              errors = blocks
              ids = [l for l in lines if re.search(r'LEVEL_PROFILE (skipped_ids|failed_ids|inert_trigger_ids|substituted_block_ids|empty_target_groups)', l)]
              timing = [l for l in lines if 'LEVEL_PROFILE' in l and l not in ids]
              print(f"::notice title=timing {name} exit={status}::" + esc('\n'.join(timing[:40]) or 'no LEVEL_PROFILE lines')[:3900])
              print(f"::notice title=ids {name}::" + esc('\n'.join(ids))[:3900])
              if errors:
                  for n, block in enumerate(errors[:4]):
                      print(f"::error title=error {name} {n}::" + esc(block)[:3900])
          PY

      - name: Probe Change of scene from the default start (real physics)
        if: always()
        env:
          GODOT_BIN: ${{ env.GODOT_BIN }}
        run: |
          set +e
          # The importer's default spawn is GD (0, 15): Level sits at (640, 925) and
          # the player at (640, 861). No input, real physics, cube mode, to GD x 600.
          GDASH_PROBE_LEVEL=/tmp/bli/90475473.gmd GDASH_PROBE_GROUPS="" GDASH_PROBE_DENSE_FROM="" \
            GDASH_PROBE_CHANNELS="" GDASH_PROBE_MACRO="" GDASH_PROBE_START_X=0 GDASH_PROBE_START_Y=15 \
            GDASH_PROBE_MODE=0 GDASH_PROBE_END_X=600 \
            timeout 400s "$GODOT_BIN" --headless --path . --audio-driver Dummy res://tools/level_probe.tscn > /tmp/probe_cos.log 2>&1
          echo "probe exit=$?"
          grep -E "PROBE|gdash-tp|SCRIPT ERROR|Parse Error|ERROR" /tmp/probe_cos.log | head -40 | cut -c1-260 > /tmp/probe_cos.txt
          python3 - <<'PY'
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          t = open('/tmp/probe_cos.txt').read()
          for n in range(0, min(len(t), 3800 * 3), 3800):
              print(f"::notice title=probe change of scene part {n // 3800}::" + esc(t[n:n + 3800]))
          PY

      - name: Region around the Change of scene cutscene (gd_level_scan --region)
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          # The Change of scene teleport exit lands at GD y ~1315. Print the objects
          # in that cutscene box: counts by id, then the first rows by x.
          for f in sorted(glob.glob('/tmp/bli/*90475473*.gmd')):
              env = dict(os.environ, REGION_LIMIT='40')
              r = subprocess.run(['python3', 'tools/gd_level_scan.py', f, '--region', '-40,250,1050,1450'],
                                 capture_output=True, text=True, env=env)
              part = r.stdout[r.stdout.find('=====REGION====='):]
              part = part.replace('=====REGION=====\n', '')
              part = part[:part.find('objects=', 40) if part.find('objects=', 40) > 0 else len(part)]
              for n in range(0, min(len(part), 3800 * 2), 3800):
                  print(f"::notice title=cutscene region part {n // 3800}::" + esc(part[n:n + 3800]))
              if r.returncode != 0 or r.stderr.strip():
                  print("::warning title=region stderr::" + esc(r.stderr[-800:]))
          PY

      - name: Groups around the Change of scene cutscene blocks (gd_level_scan --group-triggers)
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          # Block groups at the cutscene (25, 1), move/follow triggers that target them (54, 284),
          # and the follow source group (960). Triggers and members for each group.
          for f in sorted(glob.glob('/tmp/bli/*90475473*.gmd')):
              g = subprocess.run(['python3', 'tools/gd_level_scan.py', f, '--group-triggers', '1,25,54,284,960'],
                                 capture_output=True, text=True)
              part = g.stdout[g.stdout.find('=====GROUP TRIGGERS====='):].replace('=====GROUP TRIGGERS=====\n', '')
              part = part[:part.find('=====TEXT=====') if part.find('=====TEXT=====') > 0 else len(part)]
              for n in range(0, min(len(part), 3800 * 2), 3800):
                  print(f"::notice title=cutscene groups part {n // 3800}::" + esc(part[n:n + 3800]))
              if g.returncode != 0 or g.stderr.strip():
                  print("::warning title=groups stderr::" + esc(g.stderr[-800:]))
          PY

      - name: Objects around the lock trigger at (123, 1005) and the collision triggers (gd_level_scan)
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          # Lock trigger (901 at 123,1005) is touch-only: no group. Which objects sit around it,
          # and which collision triggers / collision blocks exist at all.
          for f in sorted(glob.glob('/tmp/bli/*90475473*.gmd')):
              env = dict(os.environ, REGION_LIMIT='60')
              r = subprocess.run(['python3', 'tools/gd_level_scan.py', f, '--region', '0,250,850,1100'],
                                 capture_output=True, text=True, env=env)
              part = r.stdout[r.stdout.find('=====REGION====='):].replace('=====REGION=====\n', '')
              part = part[:part.find('objects=', 40) if part.find('objects=', 40) > 0 else len(part)]
              for n in range(0, min(len(part), 3800 * 2), 3800):
                  print(f"::notice title=lock area part {n // 3800}::" + esc(part[n:n + 3800]))
              i = subprocess.run(['python3', 'tools/gd_level_scan.py', f, '--ids', '1815,3609,1816,1346,1347,901'],
                                 capture_output=True, text=True)
              part = i.stdout[i.stdout.find('=====OBJECTS BY ID====='):].replace('=====OBJECTS BY ID=====\n', '')
              part = part[:part.find('objects=', 40) if part.find('objects=', 40) > 0 else len(part)]
              for n in range(0, min(len(part), 3800 * 2), 3800):
                  print(f"::notice title=ids part {n // 3800}::" + esc(part[n:n + 3800]))
PY
