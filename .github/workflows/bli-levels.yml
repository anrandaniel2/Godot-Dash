name: bli levels check

# Manual run: downloads the shared WeTransfer levels on the runner, scans them,
# and opens each one in a real Godot build of the game. Levels are never
# committed; results come back as check-run annotations.
on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/bli-levels.yml"
      - "tools/fetch_transfer_levels.py"
  workflow_dispatch:
    inputs:
      url:
        description: "WeTransfer (or direct) link to the level files"
        required: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: godot-bin/Godot_v4.7.2-stable_linux.x86_64
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "$GODOT_BIN_URL" -O godot.zip
          mkdir -p godot-bin
          unzip -q -o godot.zip -d godot-bin

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Cache scons build cache
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-scons-profile-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/src/**') }}
          restore-keys: native-scons-profile-${{ env.GODOT_CPP_REF }}-

      - name: Build gdash_native (Linux, release-like)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages -q scons
          export SCONS_CACHE="$(pwd)/native/scons-cache"
          cd native
          scons platform=linux target=template_debug arch=x86_64 api_version=4.7 lto=none -j4 > /tmp/scons.log 2>&1 || { tail -n 60 /tmp/scons.log; exit 1; }
          ls -lh bin/linux/

      - name: Download the shared levels
        env:
          LEVEL_URL: ${{ inputs.url || 'https://we.tl/t-x5aZPEvs5KA6m201' }}
        run: |
          set -euo pipefail
          python3 tools/fetch_transfer_levels.py "$LEVEL_URL" /tmp/bli

      - name: Scan each level (gd_level_scan)
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          ids = '1006,3662,1615,1888,3828,3802,3807,3804,3809,3817,3805,3843,3854,3991,1764,1887,1964,2064,2089,579'
          for f in sorted(glob.glob('/tmp/bli/*')):
              if os.path.isdir(f) or f.endswith('transfer.bin'):
                  continue
              name = os.path.basename(f)
              p = subprocess.run(['python3', 'tools/gd_level_scan.py', f, '--ids', ids], capture_output=True, text=True)
              print(f"::notice title=scan {name} exit={p.returncode}::" + esc(p.stdout[:3800]))
              detail = p.stdout[p.stdout.find('=====OBJECTS BY ID====='):]
              detail = detail[:detail.find('objects=')] if 'objects=' in detail else detail
              chunks = [detail[k:k + 3800] for k in range(0, min(len(detail), 3800 * 6), 3800)]
              for n, chunk in enumerate(chunks):
                  print(f"::notice title=ids {name} part {n}::" + esc(chunk))
              if p.stderr.strip():
                  print(f"::warning title=scan stderr {name}::" + esc(p.stderr[-800:]))
          PY

      - name: Import project resources
        run: |
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path . --import > import.log 2>&1 || true
          grep -n "SCRIPT ERROR\|Parse Error" import.log | head -20 || true

      - name: Open each level in the game
        env:
          GODOT_BIN: ${{ env.GODOT_BIN }}
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          godot = os.environ['GODOT_BIN']
          for f in sorted(glob.glob('/tmp/bli/*')):
              if os.path.isdir(f) or f.endswith('transfer.bin'):
                  continue
              name = os.path.basename(f)
              env = dict(os.environ, GDASH_PROFILE_LEVEL=f, GDASH_PROFILE_ALLOW_MISMATCH='1')
              try:
                  p = subprocess.run(
                      [godot, '--headless', '--path', '.', '--audio-driver', 'Dummy',
                       'res://tools/level_memory_profile.tscn'],
                      capture_output=True, text=True, timeout=400, env=env)
                  log, status = p.stdout + p.stderr, p.returncode
              except subprocess.TimeoutExpired as e:
                  log, status = (e.stdout or b'').decode(errors='replace') + (e.stderr or b'').decode(errors='replace'), 'timeout'
              open(f'/tmp/bli/{name}.log', 'w').write(log)
              print(f"##### {name} exit={status}")
              lines = log.splitlines()
              blocks, seen = [], set()
              for k, l in enumerate(lines):
                  if re.search(r'SCRIPT ERROR|ERROR|Parse Error', l):
                      block = '\n'.join(lines[k:k + 3])
                      if block not in seen:
                          seen.add(block)
                          blocks.append(block)
              errors = blocks
              ids = [l for l in lines if re.search(r'LEVEL_PROFILE (skipped_ids|failed_ids|inert_trigger_ids|substituted_block_ids|empty_target_groups)', l)]
              timing = [l for l in lines if 'LEVEL_PROFILE' in l and l not in ids]
              print(f"::notice title=timing {name} exit={status}::" + esc('\n'.join(timing[:40]) or 'no LEVEL_PROFILE lines')[:3900])
              print(f"::notice title=ids {name}::" + esc('\n'.join(ids))[:3900])
              if errors:
                  for n, block in enumerate(errors[:4]):
                      print(f"::error title=error {name} {n}::" + esc(block)[:3900])
          PY
