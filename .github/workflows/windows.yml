name: Build Windows Forward+

on:
  workflow_dispatch:
  push:
    branches: [main, master, "arena/**"]

concurrency:
  group: windows-forward-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CPP_REF: 6cceaf6a5f8b0d78ac5d71c139fd7fabba43b918

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCONS_CACHE: ${{ github.workspace }}/native/scons-cache
    steps:
      # The LFS ICO is unavailable on the mirror. Generate it from the tracked
      # PNG in the build workspace instead of blocking checkout on LFS.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check export staging and renderer invariants
        run: python -m unittest discover -s tools -p test_windows_export.py

      - name: Cache Godot editor and templates outside the project
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-windows
          key: godot-windows-${{ env.GODOT_VERSION }}-v1

      - name: Install matching Windows editor and templates
        run: python tools/windows_ci.py install

      - name: Check index parity and benchmark the rejected candidate
        run: python tools/windows_ci.py benchmark

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: native/godot-cpp
          fetch-depth: 1

      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: native/scons-cache
          key: native-windows-x64-${{ env.GODOT_CPP_REF }}-${{ hashFiles('native/src/**', 'native/SConstruct', 'native/build_profile.json') }}
          restore-keys: native-windows-x64-${{ env.GODOT_CPP_REF }}-

      - name: Install build tools
        run: python -m pip install scons pillow

      - name: Build optimized x86-64 extension with static C++ runtime
        run: python tools/windows_ci.py build

      - name: Import, export Forward+, verify exported DLL, package
        run: python tools/windows_ci.py export

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: godot-dash-windows-x86_64-${{ github.sha }}
          path: export/godot-dash-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish this build without replacing another branch's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-$($env:GITHUB_SHA.Substring(0, 8))"
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "Windows x86-64, Godot 4.7.2, Forward+. Optimized native DLL included. Extract the whole ZIP. Headless native loading passed; GPU rendering and real-level performance require device testing. Includes optional performance capture. Commit: $env:GITHUB_SHA. Run: $url"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag export/godot-dash-windows-x86_64.zip --clobber
          } else {
            gh release create $tag export/godot-dash-windows-x86_64.zip --target $env:GITHUB_SHA --title "Windows Forward+ $($env:GITHUB_SHA.Substring(0, 8))" --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows release publication failed' }

      - name: Upload diagnostic logs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics-${{ github.sha }}
          path: export/windows-logs/*.log
          if-no-files-found: warn
