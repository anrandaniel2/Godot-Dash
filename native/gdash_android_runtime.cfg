[configuration]

entry_symbol = "gdash_native_library_init"
compatibility_minimum = "4.1"

# Deliberately stored as .cfg: Godot 4.7.2's Android exporter removes the
# [libraries] section from exported .gdextension resources. NativeCore loads
# this byte-for-byte non-resource manifest through GDExtensionManager.
[libraries]

android = "res://native/bin/android_debug/arm64-v8a/libgdash_native.so"
